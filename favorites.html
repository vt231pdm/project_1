<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookStore — Улюблені книги</title>

    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components/card.css" />
    <link rel="stylesheet" href="css/components/buttons.css" />
  </head>
  <body>
    <header class="header"></header>

    <main class="main container">
      <div class="page-header">
        <h1 class="page-title">Улюблені книги</h1>
        <a href="index.html" class="back-link">← До каталогу</a>
      </div>

      <div class="catalog__grid" id="favorites-grid"></div>

      <div class="empty-state is-hidden" id="favorites-empty">
        <div class="empty-state__icon-wrap">
          <img
            src="img/icons/heart.png"
            alt="Улюблене"
            class="empty-state__img"
          />
        </div>
        <h2 class="empty-state__title">Список улюбленого порожній</h2>
        <p class="empty-state__description">
          Тут з'являться товари, які ви позначите сердечком у каталозі.
        </p>
        <a href="index.html" class="btn btn--primary">Перейти до каталогу</a>
      </div>
    </main>

    <footer class="footer"></footer>

    <script type="module" src="js/pages/favorites-page.js"></script>
  </body>
</html>
