<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookStore — Кошик</title>

    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components/cart-item.css" />
    <link rel="stylesheet" href="css/components/buttons.css" />
  </head>
  <body>
    <header class="header"></header>

    <main class="main container">
      <div class="page-header">
        <h1 class="page-title">Ваш кошик</h1>
        <a href="index.html" class="back-link">← Продовжити вибір</a>
      </div>

      <div class="cart-layout" id="cart-content">
        <section class="cart-items" id="cart-items-container"></section>

        <aside class="cart-summary">
          <h2 class="cart-summary__title">Підсумок замовлення</h2>
          <div class="cart-summary__row">
            <span>Кількість товарів:</span>
            <span id="summary-total-count">0 шт.</span>
          </div>
          <div class="cart-summary__row cart-summary__row--total">
            <span>Разом:</span>
            <span id="summary-total-price">0 грн</span>
          </div>
          <button
            type="button"
            class="btn btn--primary btn--block"
            id="checkout-button"
          >
            Оформити замовлення
          </button>
        </aside>
      </div>

      <div class="empty-state is-hidden" id="cart-empty">
        <div class="empty-state__icon-wrap">
          <img
            src="img/icons/shopping-cart.png"
            alt="Кошик"
            class="empty-state__img"
          />
        </div>
        <h2 class="empty-state__title">Ваш кошик порожній</h2>
        <p class="empty-state__description">
          Додайте потрібні книги з каталогу або зі списку улюбленого.
        </p>
        <a href="index.html" class="btn btn--primary">До каталогу</a>
      </div>
    </main>

    <footer class="footer"></footer>

    <script type="module" src="js/pages/cart-page.js"></script>
  </body>
</html>
