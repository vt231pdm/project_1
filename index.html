<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="BookStore — каталог книг з пошуком, фільтрами, обраним та кошиком"
    />
    <title>BookStore — Каталог книг</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" type="image/png" href="img/icons/book.png" />
  </head>
  <body>
    <header class="header"></header>

    <main class="main container">
      <div class="content-layout">
        <aside class="sidebar-filters" aria-label="Фільтри каталогу">
          <form class="filters-form" id="filters-form">
            <div class="filters-form__header">
              <h2 class="filters-form__title">Фільтр</h2>
              <button
                type="reset"
                id="reset-filters"
                class="filters-form__reset"
              >
                Скинути
              </button>
            </div>

            <div class="filter-group">
              <label for="sort-select" class="filter-group__label">
                Сортування
              </label>

              <select id="sort-select" class="filter-select">
                <option value="default">За замовчуванням</option>
                <option value="price-asc">Від дешевих до дорогих</option>
                <option value="price-desc">Від дорогих до дешевих</option>
                <option value="title-asc">За назвою (А-Я)</option>
              </select>
            </div>

            <fieldset class="filter-group filter-group--prices">
              <legend class="filter-group__label">Ціна (грн)</legend>

              <div class="price-range">
                <label class="sr-only" for="price-min"> Мінімальна ціна </label>

                <input
                  type="number"
                  id="price-min"
                  placeholder="Від"
                  min="0"
                  step="1"
                  inputmode="numeric"
                />

                <span aria-hidden="true">—</span>

                <label class="sr-only" for="price-max">
                  Максимальна ціна
                </label>

                <input
                  type="number"
                  id="price-max"
                  placeholder="До"
                  min="0"
                  step="1"
                  inputmode="numeric"
                />
              </div>

              <p
                class="filter-error is-hidden"
                id="price-error"
                role="alert"
              ></p>
            </fieldset>
          </form>
        </aside>

        <section class="catalog" aria-labelledby="catalog-title">
          <div class="catalog__header">
            <h1 class="catalog__title" id="catalog-title">Каталог книг</h1>

            <span class="catalog__count" id="catalog-count" aria-live="polite">
              Знайдено: 0
            </span>
          </div>

          <div class="catalog__grid" id="catalog-grid"></div>

          <div
            class="catalog__empty is-hidden"
            id="catalog-empty"
            role="status"
          >
            <p>За вашим запитом нічого не знайдено 😕</p>
          </div>
        </section>
      </div>
    </main>

    <footer class="footer"></footer>

    <script type="module" src="js/pages/main.js"></script>
  </body>
</html>
